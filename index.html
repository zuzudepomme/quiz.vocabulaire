<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de mots rares</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #2a2a2a;
    --orange: #e8862a;
    --orange-light: #f4a94f;
    --text: #e6e6e6;
    --muted: #9a9a9a;
    --green: #3ecf6a;
    --red: #e2544b;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .app { width: 100%; max-width: 640px; position: relative; }
  h1 { color: var(--orange); text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 32px; }
  .panel { background: var(--panel); border-radius: 12px; padding: 28px; border-left: 4px solid var(--orange); position: relative; }
  .hidden { display: none !important; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .btn-menu {
    background: #3a3a3a; color: var(--text); border-radius: 8px;
    padding: 8px 14px; font-size: 14px;
  }
  .btn-menu:hover { background: #474747; }

  .size-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  button {
    font-family: inherit; font-size: 16px; cursor: pointer;
    border: none; border-radius: 8px; padding: 14px;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-choice { background: #3a3a3a; color: var(--text); }
  .btn-choice:hover { background: #474747; }
  .btn-choice.selected { outline: 2px solid var(--orange); }

  .btn-primary { background: var(--orange); color: #1e1e1e; font-weight: 600; width: 100%; margin-top: 8px; }
  .btn-primary:hover { background: var(--orange-light); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .btn-secondary { background: #3a3a3a; color: var(--text); width: 100%; margin-top: 10px; }
  .btn-secondary:hover { background: #474747; }

  .custom-row { display: flex; gap: 10px; margin-top: 8px; }
  .custom-row input, .pseudo-row input {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444;
    background: #1e1e1e; color: var(--text); font-size: 15px;
  }

  .progress { color: var(--muted); margin-bottom: 8px; font-size: 14px; }
  .word { font-size: 28px; font-weight: 700; color: var(--orange-light); margin-bottom: 20px; }
  .option {
    display: block; width: 100%; text-align: left; background: #333; color: var(--text);
    margin-bottom: 12px; padding: 14px 16px; border-radius: 8px; line-height: 1.4;
  }
  .option:hover { background: #3f3f3f; }
  .option.correct { background: #234d31; outline: 2px solid var(--green); }
  .option.wrong { background: #4d2723; outline: 2px solid var(--red); }
  .option:disabled { cursor: default; }

  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 8px; font-weight: 600; }
  .feedback.correct { background: #1e3d29; color: var(--green); }
  .feedback.wrong { background: #402420; color: var(--red); }

  .citations { margin-top: 16px; color: var(--muted); font-style: italic; font-size: 14px; line-height: 1.5; }
  .citations p { margin: 6px 0; }

  .next-hint { margin-top: 20px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; }

  .score-big { font-size: 40px; color: var(--orange); text-align: center; font-weight: 700; margin: 12px 0 6px; }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 24px; }

  .status { text-align: center; color: var(--muted); }

  .lb-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .lb-tabs button { flex: 1; }
  .lb-list { list-style: none; padding: 0; margin: 0; }
  .lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    background: #333; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px;
  }
  .lb-rank { color: var(--orange-light); font-weight: 700; width: 28px; }
  .lb-pseudo { flex: 1; }
  .lb-pct { font-weight: 700; }
  .lb-empty { color: var(--muted); text-align: center; padding: 20px 0; }

  .pseudo-row { display: flex; gap: 10px; margin: 16px 0; }

  .rare-word {
    color: var(--orange-light);
    font-weight: 600;
    cursor: help;
    border-bottom: 1px dotted var(--orange-light);
  }
  .rare-word:hover { color: var(--orange); }

  .story-list-item {
    display: block; width: 100%; text-align: left; background: #333; color: var(--text);
    margin-bottom: 10px; padding: 14px 16px; border-radius: 8px;
  }
  .story-list-item:hover { background: #3f3f3f; }
  .story-list-item .story-type {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px;
    margin-left: 8px; color: #1e1e1e; font-weight: 700;
  }
  .story-type.coherent { background: var(--green); }
  .story-type.loufoque { background: var(--orange); }

  .story-text { line-height: 1.7; white-space: pre-wrap; }

  .tooltip-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .tooltip-box {
    background: var(--panel); border-left: 4px solid var(--orange);
    border-radius: 10px; padding: 20px; max-width: 420px; margin: 16px;
  }
  .tooltip-box h3 { color: var(--orange-light); margin: 0 0 8px; }
  .tooltip-box p { margin: 0; color: var(--text); line-height: 1.5; }
  .tooltip-close { margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <h1>Quiz de mots rares</h1>
  <div class="subtitle">D'après le dictionnaire du français difficile de webnext.fr</div>

  <!-- CHARGEMENT -->
  <div id="loading-screen" class="panel">
    <p class="status" id="loading-status">Chargement des mots...</p>
  </div>

  <!-- PSEUDO (première visite) -->
  <div id="pseudo-screen" class="panel hidden">
    <p>Choisis un pseudo pour le leaderboard :</p>
    <div class="pseudo-row">
      <input id="pseudo-input" type="text" maxlength="20" placeholder="Ton pseudo">
    </div>
    <button id="pseudo-btn" class="btn-primary">Valider</button>
  </div>

  <!-- MENU -->
  <div id="menu-screen" class="panel hidden">
    <p>Combien de mots veux-tu dans ta session ?</p>
    <div class="size-options">
      <button class="btn-choice" data-size="25">25 mots</button>
      <button class="btn-choice" data-size="50">50 mots</button>
      <button class="btn-choice" data-size="100">100 mots</button>
      <button class="btn-choice" data-size="custom">Personnalisé</button>
    </div>
    <div id="custom-row" class="custom-row hidden">
      <input id="custom-input" type="number" min="1" placeholder="Nombre de mots">
    </div>
    <button id="start-btn" class="btn-primary">Commencer</button>
    <button id="leaderboard-btn" class="btn-secondary">🏆 Leaderboard</button>
    <button id="stories-btn" class="btn-secondary">📖 Petites histoires</button>
  </div>

  <!-- PETITES HISTOIRES : liste -->
  <div id="stories-list-screen" class="panel hidden">
    <div class="top-bar">
      <button class="btn-menu" id="stories-back-btn">← Menu</button>
      <span></span>
    </div>
    <p>Chaque mot en <span style="color:var(--orange-light); font-weight:600;">orange</span> a sa définition : clique dessus ou survole-le.</p>
    <div id="stories-list"></div>
  </div>

  <!-- PETITES HISTOIRES : lecture -->
  <div id="story-read-screen" class="panel hidden">
    <div class="top-bar">
      <button class="btn-menu" id="story-back-btn">← Histoires</button>
      <span></span>
    </div>
    <h2 id="story-title" style="color:var(--orange-light); margin-top:0;"></h2>
    <div class="story-text" id="story-text"></div>
  </div>

  <!-- LEADERBOARD -->
  <div id="leaderboard-screen" class="panel hidden">
    <div class="top-bar">
      <button class="btn-menu" id="lb-back-btn">← Menu</button>
      <span></span>
    </div>
    <div class="lb-tabs">
      <button class="btn-choice lb-tab" data-lb-size="25">25 mots</button>
      <button class="btn-choice lb-tab" data-lb-size="50">50 mots</button>
      <button class="btn-choice lb-tab" data-lb-size="100">100 mots</button>
    </div>
    <ul class="lb-list" id="lb-list"></ul>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen" class="panel hidden">
    <div class="top-bar">
      <button class="btn-menu" id="quiz-menu-btn">☰ Menu</button>
      <span></span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="word" id="word"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div id="citations" class="citations"></div>
    <div class="next-hint" id="next-hint"></div>
  </div>

  <!-- SCORE -->
  <div id="score-screen" class="panel hidden">
    <div class="score-big" id="score-big"></div>
    <div class="score-sub" id="score-sub"></div>
    <button id="menu-btn" class="btn-primary">Retour au menu principal</button>
  </div>
</div>

<script>
let MOTS = [];

const PSEUDO_KEY = 'quiz_mots_rares_pseudo';

const SUPABASE_URL = 'https://chpwwdxrcdzcibkhencn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MJSJ362OpDVbeKoeVbE2kQ_3oaBSu1D';
let supabaseClient = null;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error('Supabase indisponible, le leaderboard sera désactivé :', e);
}

const loadingScreen = document.getElementById('loading-screen');
const pseudoScreen = document.getElementById('pseudo-screen');
const menuScreen = document.getElementById('menu-screen');
const leaderboardScreen = document.getElementById('leaderboard-screen');
const quizScreen = document.getElementById('quiz-screen');
const scoreScreen = document.getElementById('score-screen');
const storiesListScreen = document.getElementById('stories-list-screen');
const storyReadScreen = document.getElementById('story-read-screen');

let HISTOIRES = [];

const sizeButtons = document.querySelectorAll('.btn-choice[data-size]');
const customRow = document.getElementById('custom-row');
const customInput = document.getElementById('custom-input');
const startBtn = document.getElementById('start-btn');

let selectedSize = 25;
let currentSessionSize = null;
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function showOnly(screen) {
  [loadingScreen, pseudoScreen, menuScreen, leaderboardScreen, quizScreen, scoreScreen,
   storiesListScreen, storyReadScreen]
    .forEach(s => s.classList.add('hidden'));
  screen.classList.remove('hidden');
}

// ------------------ Pseudo ------------------

function getPseudo() {
  return localStorage.getItem(PSEUDO_KEY);
}

document.getElementById('pseudo-btn').addEventListener('click', () => {
  const val = document.getElementById('pseudo-input').value.trim();
  if (!val) {
    document.getElementById('pseudo-input').focus();
    return;
  }
  localStorage.setItem(PSEUDO_KEY, val);
  showOnly(menuScreen);
});

document.getElementById('pseudo-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('pseudo-btn').click();
});

// ------------------ Leaderboard (Supabase, partagé entre tous les joueurs) ------------------

async function saveResult(size, scoreVal, total) {
  if (!supabaseClient) return;
  const pct = Math.round((scoreVal / total) * 100);
  const { error } = await supabaseClient.from('leaderboard').insert({
    pseudo: getPseudo() || 'Anonyme',
    taille: size,
    score: scoreVal,
    total: total,
    pct: pct,
  });
  if (error) console.error('Erreur enregistrement leaderboard :', error);
}

async function renderLeaderboard(size) {
  document.querySelectorAll('.lb-tab').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.lbSize, 10) === size);
  });
  const list = document.getElementById('lb-list');

  if (!supabaseClient) {
    list.innerHTML = '<li class="lb-empty">Leaderboard indisponible pour le moment.</li>';
    return;
  }

  list.innerHTML = '<li class="lb-empty">Chargement...</li>';

  const { data, error } = await supabaseClient
    .from('leaderboard')
    .select('*')
    .eq('taille', size)
    .order('pct', { ascending: false })
    .order('created_at', { ascending: true })
    .limit(20);

  if (error) {
    list.innerHTML = '<li class="lb-empty">Impossible de charger le leaderboard (' + error.message + ').</li>';
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = '<li class="lb-empty">Aucun score enregistré pour cette catégorie pour l\'instant.</li>';
    return;
  }

  list.innerHTML = data.map((e, i) => `
    <li>
      <span class="lb-rank">${i + 1}.</span>
      <span class="lb-pseudo">${escapeHtml(e.pseudo)}</span>
      <span class="lb-pct">${e.pct}% (${e.score}/${e.total})</span>
    </li>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.querySelectorAll('.lb-tab').forEach(btn => {
  btn.addEventListener('click', () => renderLeaderboard(parseInt(btn.dataset.lbSize, 10)));
});

document.getElementById('leaderboard-btn').addEventListener('click', () => {
  showOnly(leaderboardScreen);
  renderLeaderboard(25);
});

document.getElementById('lb-back-btn').addEventListener('click', () => showOnly(menuScreen));

// ------------------ Chargement des mots ------------------

fetch('mots.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    MOTS = data;
    if (!MOTS.length) throw new Error('Fichier mots.json vide');
    if (getPseudo()) {
      showOnly(menuScreen);
    } else {
      showOnly(pseudoScreen);
    }
    sizeButtons[0].classList.add('selected');
  })
  .catch(err => {
    document.getElementById('loading-status').textContent =
      "Impossible de charger mots.json (" + err.message + "). " +
      "Génère-le avec build_data.py puis recharge la page.";
  });

fetch('histoires.json')
  .then(r => r.ok ? r.json() : [])
  .then(data => { HISTOIRES = data || []; })
  .catch(() => { HISTOIRES = []; });

// ------------------ Petites histoires ------------------

function motDefinition(mot) {
  const entry = MOTS.find(m => m.mot.toLowerCase() === mot.toLowerCase());
  return entry ? entry.definition : null;
}

function renderStoryText(texte) {
  return texte.replace(/\{\{([^|}]+)(?:\|([^}]+))?\}\}/g, (match, mot, display) => {
    const shown = display || mot;
    const safeMot = mot.trim().replace(/"/g, '&quot;');
    return `<span class="rare-word" data-mot="${safeMot}">${shown}</span>`;
  });
}

function renderStoriesList() {
  const listDiv = document.getElementById('stories-list');
  if (!HISTOIRES.length) {
    listDiv.innerHTML = '<p class="lb-empty">Aucune histoire disponible pour le moment.</p>';
    return;
  }
  listDiv.innerHTML = HISTOIRES.map((h, i) => `
    <button class="story-list-item" data-story-index="${i}">
      ${escapeHtml(h.titre)}
      <span class="story-type ${h.type}">${h.type === 'coherent' ? 'Cohérente' : 'Loufoque'}</span>
    </button>
  `).join('');
  listDiv.querySelectorAll('.story-list-item').forEach(btn => {
    btn.addEventListener('click', () => openStory(parseInt(btn.dataset.storyIndex, 10)));
  });
}

function openStory(index) {
  const h = HISTOIRES[index];
  document.getElementById('story-title').textContent = h.titre;
  document.getElementById('story-text').innerHTML = renderStoryText(h.texte);
  showOnly(storyReadScreen);

  document.querySelectorAll('#story-text .rare-word').forEach(span => {
    span.addEventListener('click', () => showDefinitionPopup(span.dataset.mot));
    span.title = 'Cliquer pour voir la définition';
  });
}

function showDefinitionPopup(mot) {
  const def = motDefinition(mot);
  const overlay = document.createElement('div');
  overlay.className = 'tooltip-overlay';
  overlay.innerHTML = `
    <div class="tooltip-box">
      <h3>${escapeHtml(mot)}</h3>
      <p>${def ? escapeHtml(def) : "Définition non trouvée."}</p>
      <button class="btn-primary tooltip-close">Fermer</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.tooltip-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

document.getElementById('stories-btn').addEventListener('click', () => {
  renderStoriesList();
  showOnly(storiesListScreen);
});
document.getElementById('stories-back-btn').addEventListener('click', () => showOnly(menuScreen));
document.getElementById('story-back-btn').addEventListener('click', () => showOnly(storiesListScreen));

// ------------------ Menu / sélection taille ------------------

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Retire les mentions d'étymologie ("du latin...", "(du grec ...)", etc.)
// qui trahissent trop facilement le mot correspondant à la définition.
function stripEtymology(text) {
  if (!text) return text;
  let cleaned = text;

  // Segments entre parenthèses évoquant une origine/étymologie
  cleaned = cleaned.replace(
    /\(([^()]*\b(latin|grec|ancien français|vieux français|arabe|allemand|anglais|sanskrit|italien|espagnol|étymologie|étymol\.?)\b[^()]*)\)/gi,
    ''
  );

  // Clause en tête de phrase du type "Du latin ..., " / "De l'ancien français ..., "
  cleaned = cleaned.replace(
    /^(du|de l['’]|issu du|issu de l['’]|vient du|vient de l['’])\s+(latin|grec|ancien français|vieux français|arabe|allemand|anglais|sanskrit|italien|espagnol)[^,.;]*[,.;]?\s*/i,
    ''
  );

  cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
  // Si le nettoyage a tout mangé, on retombe sur le texte d'origine
  return cleaned.length > 3 ? cleaned : text;
}

sizeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    sizeButtons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (btn.dataset.size === 'custom') {
      customRow.classList.remove('hidden');
      selectedSize = null;
    } else {
      customRow.classList.add('hidden');
      selectedSize = parseInt(btn.dataset.size, 10);
    }
  });
});

startBtn.addEventListener('click', () => {
  let size = selectedSize;
  if (size === null) {
    size = parseInt(customInput.value, 10);
    if (!size || size < 1) { customInput.focus(); return; }
  }
  size = Math.min(size, MOTS.length);
  startQuiz(size);
});

document.getElementById('quiz-menu-btn').addEventListener('click', () => {
  showOnly(menuScreen);
});

document.getElementById('menu-btn').addEventListener('click', () => {
  showOnly(menuScreen);
  sizeButtons.forEach(b => b.classList.remove('selected'));
  customRow.classList.add('hidden');
  customInput.value = '';
  selectedSize = 25;
  sizeButtons[0].classList.add('selected');
});

// ------------------ Quiz ------------------

function buildQuestions(size) {
  const chosen = shuffle(MOTS).slice(0, size);
  return chosen.map(entry => {
    // On privilégie des distracteurs de longueur de définition proche,
    // pour éviter qu'on repère la bonne réponse juste par son "style".
    const targetLen = entry.definition.length;
    const others = MOTS.filter(m => m.mot !== entry.mot);
    const closeOthers = others.filter(m => Math.abs(m.definition.length - targetLen) <= 30);
    const pool = closeOthers.length >= 2 ? closeOthers : others;
    const distractors = shuffle(pool).slice(0, 2);
    const options = shuffle([entry, ...distractors]);
    const correctIndex = options.findIndex(o => o.mot === entry.mot);
    return { mot: entry.mot, citations: entry.citations || [], options, correctIndex };
  });
}

function startQuiz(size) {
  questions = buildQuestions(size);
  currentSessionSize = size;
  currentIndex = 0;
  score = 0;
  showOnly(quizScreen);
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById('progress').textContent =
    `Mot ${currentIndex + 1}/${questions.length} — Score : ${score}`;
  document.getElementById('word').textContent = q.mot;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = stripEtymology(opt.definition);
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsDiv.appendChild(btn);
  });

  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('citations').innerHTML = '';
  document.getElementById('next-hint').textContent = '';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const optionButtons = document.querySelectorAll('#options .option');
  optionButtons.forEach(b => b.disabled = true);

  optionButtons[q.correctIndex].classList.add('correct');
  const feedback = document.getElementById('feedback');
  feedback.classList.remove('hidden');

  if (idx === q.correctIndex) {
    score++;
    feedback.classList.add('correct');
    feedback.classList.remove('wrong');
    feedback.textContent = '✅ Bonne réponse !';
  } else {
    optionButtons[idx].classList.add('wrong');
    feedback.classList.add('wrong');
    feedback.classList.remove('correct');
    feedback.textContent = '❌ Faux.';
  }

  const citationsDiv = document.getElementById('citations');
  if (q.citations.length > 0) {
    citationsDiv.innerHTML = '<p><strong>Exemples d\'usage :</strong></p>' +
      q.citations.map(c => `<p>« ${c} »</p>`).join('');
  } else {
    citationsDiv.innerHTML = '<p>(Aucun exemple d\'usage disponible.)</p>';
  }

  const others = q.options.filter((opt, i) => i !== q.correctIndex);
  if (others.length > 0) {
    const shortest = (list) => {
      if (!list || list.length === 0) return null;
      return list.reduce((a, b) => (b.length < a.length ? b : a));
    };
    citationsDiv.innerHTML += '<p style="margin-top:14px;"><strong>Les autres définitions proposées :</strong></p>' +
      others.map(opt => {
        const ex = shortest(opt.citations);
        return `<p>${opt.mot} correspond à : ${stripEtymology(opt.definition)}` +
          (ex ? ` — « ${ex} »` : '') + `</p>`;
      }).join('');
  }

  document.getElementById('progress').textContent =
    `Mot ${currentIndex + 1}/${questions.length} — Score : ${score}`;

  const hint = document.getElementById('next-hint');
  hint.textContent = currentIndex < questions.length - 1
    ? 'Appuie sur ESPACE (ou clique) pour passer au mot suivant →'
    : 'Appuie sur ESPACE pour voir ton score final';
  hint.onclick = nextQuestion;
}

function nextQuestion() {
  if (!answered) return;
  currentIndex++;
  if (currentIndex < questions.length) {
    showQuestion();
  } else {
    showScore();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !quizScreen.classList.contains('hidden')) {
    e.preventDefault();
    nextQuestion();
  }
});

async function showScore() {
  if ([25, 50, 100].includes(currentSessionSize)) {
    await saveResult(currentSessionSize, score, questions.length);
  }
  showOnly(scoreScreen);
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-big').textContent = `${score}/${questions.length}`;
  document.getElementById('score-sub').textContent = `${pct}% de bonnes réponses`;
}
</script>
</body>
</html>
